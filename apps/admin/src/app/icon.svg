<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Admin">
  <rect width="32" height="32" rx="7" fill="#1d4ed8"/>
  <!-- Three stacked rows: the order queue, which is what this app is. Cool blue against the
       diner app's saffron, so the two are never confused on the same tablet. -->
  <rect x="8" y="10" width="16" height="2.6" rx="1.3" fill="#fff"/>
  <rect x="8" y="15" width="16" height="2.6" rx="1.3" fill="#fff" opacity="0.75"/>
  <rect x="8" y="20" width="10" height="2.6" rx="1.3" fill="#fff" opacity="0.5"/>
</svg>
