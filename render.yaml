# tableX -- Render Blueprint for the production API.
#
# Scope is the backend only. Postgres is NOT declared here: the database is a Supabase
# project, and its connection string arrives as DATABASE_URL below.
#
# The diner and admin apps are on Vercel (tabley.in and admin.tabley.in), not here.
#
# Apply with: Render dashboard -> Blueprints -> New Blueprint Instance -> pick this repo.
# Values marked `sync: false` are deliberately not in this file and must be set in the
# dashboard on first apply.

services:
  - type: web
    name: tablex-api
    runtime: docker
    # Match this to the Supabase project's region. Every request runs several queries, so
    # server-to-database latency is multiplied in a way that user-to-server latency is not
    # -- co-locating the two matters more than moving the API closer to diners.
    region: singapore
    branch: main

    # FREE TIER, CHOSEN DELIBERATELY -- two consequences that are not obvious later:
    #
    #  1. The service spins down after inactivity, and the next request waits ~50s while it
    #     starts. A diner scanning a QR code at a table is exactly that request.
    #  2. preDeployCommand is a paid feature, so it is absent below and MIGRATIONS DO NOT RUN
    #     AUTOMATICALLY. The server will start happily against a database with no tables and
    #     fail on the first query. See docs/DEPLOYMENT.md -- migrations must be run by hand
    #     before the first deploy and after every schema change.
    #
    # Upgrading to `starter` fixes both: restore preDeployCommand (the command is in
    # docs/DEPLOYMENT.md) and delete this note.
    plan: free

    dockerfilePath: ./backend/Dockerfile
    # The Go module is self-contained in backend/; see the note at the top of the Dockerfile.
    dockerContext: ./backend

    # Ready, not live: /health/live answers as soon as the process is up, whereas
    # /health/ready checks the database. Routing traffic to an instance that cannot reach
    # Postgres just converts a deploy problem into 500s.
    #
    # Note it only proves the connection, not the schema -- with migrations run by hand this
    # will report healthy against an empty database.
    healthCheckPath: /api/public/v1/health/ready

    envVars:
      # ---- set in the dashboard on first apply ----

      # Supabase connection string. config.applyEnv reads DATABASE_URL directly and a DSN
      # overrides every discrete database field, so nothing else needs configuring.
      #
      # Use the SESSION MODE pooler string, not Transaction mode. The stack is GORM -> pgx,
      # which uses prepared statements by default; the transaction-mode pooler does not
      # support them and fails with "prepared statement already exists" under concurrency --
      # intermittently, and only once two requests overlap, which is the worst way to find
      # out. Supabase's direct-connection host is also IPv6-only without the paid IPv4
      # add-on, so the pooler is the reachable choice from here.
      - key: DATABASE_URL
        sync: false

      # Generate with: openssl rand -hex 32
      # Rotating it invalidates every staff session, which is the intended behaviour.
      - key: TABLEX_JWT_SECRET
        sync: false

      # https://tabley.in -- encoded into every table QR code and validated at startup.
      - key: TABLEX_DINER_BASE_URL
        sync: false

      # https://admin.tabley.in
      - key: TABLEX_ADMIN_BASE_URL
        sync: false

      # Comma-separated CORS allowlist, no spaces:
      #   https://tabley.in,https://admin.tabley.in
      # These must be the origins the browser actually reports. Set them to the .vercel.app
      # hosts and every call from tabley.in is blocked while the API looks perfectly healthy.
      - key: TABLEX_ALLOWED_ORIGINS
        sync: false

      # OPTIONAL, AND A POLICY DECISION (DECISIONS.md D14).
      #
      # Unset, /api/platform/v1 is never mounted and onboarding answers 404 -- tenants would
      # then have to be created directly in Supabase's SQL editor. Set it and the admin app's
      # /onboard page can create the first restaurant, its owner login and its tables.
      #
      # Treat it like a root password: >= 32 characters (enforced in production), never the
      # same value as TABLEX_JWT_SECRET, rotated when someone holding it leaves.
      # Generate with: openssl rand -hex 32
      - key: TABLEX_PLATFORM_TOKEN
        sync: false

      # OPTIONAL. Dish photo uploads, held in Cloudflare R2 (docs/DECISIONS.md D15).
      #
      # Leave all five unset and uploads are disabled: the admin panel hides the control and
      # dishes keep whatever image_url was pasted into them. That is a working deployment, not
      # a degraded one.
      #
      # Set them and it is ALL FIVE OR NONE -- a partially configured block fails startup
      # rather than silently disabling uploads, so a deploy meant to enable them cannot report
      # success while doing nothing.
      #
      # R2, not S3. From the Cloudflare dashboard: R2 -> Manage API Tokens, scoped to Object
      # Read & Write on this one bucket. The Go client is the S3 protocol client because R2
      # publishes no SDK of its own; no AWS account is involved and AWS keys will not work.
      - key: TABLEX_R2_ACCOUNT_ID
        sync: false
      - key: TABLEX_R2_ACCESS_KEY_ID
        sync: false
      - key: TABLEX_R2_SECRET_ACCESS_KEY
        sync: false
      - key: TABLEX_R2_BUCKET
        sync: false

      # The public origin diners fetch images from: a custom domain bound to the bucket in the
      # Cloudflare dashboard, e.g. https://img.tabley.in.
      #
      # NOT the <account>.r2.cloudflarestorage.com endpoint -- that is the authenticated API
      # and serves nothing publicly, so every dish photo would 401. Startup rejects that value
      # by name. Must be https in production, or the browser blocks it as mixed content and the
      # menu renders with no photographs at all.
      #
      # Whatever host this names must also be added to images.remotePatterns in
      # apps/diner/next.config.ts and apps/admin/next.config.ts.
      - key: TABLEX_R2_PUBLIC_BASE_URL
        sync: false

      # ---- non-secret, safe to keep in the repository ----

      - key: TABLEX_ENV
        # Turns on the stricter half of config.Validate: minimum secret lengths and the
        # trusted-proxies requirement below.
        value: production

      - key: TABLEX_PORT
        value: "8080"

      - key: TABLEX_LOG_FORMAT
        value: json

      # VERIFY THIS ONCE DEPLOYED. Render terminates TLS at its edge and forwards over the
      # private network, so the immediate peer is a private address and this range covers it.
      # If it is wrong, Gin reads the wrong entry from X-Forwarded-For, the client IP becomes
      # attacker-controlled, and the per-IP rate limiter silently stops limiting -- it fails
      # open and looks healthy. Confirm against a real request's forwarded chain.
      - key: TABLEX_TRUSTED_PROXIES
        value: 10.0.0.0/8
